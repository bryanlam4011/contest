<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results — Chili Cook-Off</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">← Back</a>
    <h1>Results</h1>

    <div id="no-votes" class="waiting-box hidden">
      <div class="waiting-emoji">🌶️</div>
      <p>No votes yet — the polls are open!</p>
    </div>

    <div id="winner-box" class="winner-box hidden">
      <div class="confetti-row">🎉 🏆 🎉</div>
      <p class="winner-label">The Winner Is</p>
      <div class="winner-name" id="winner-name"></div>
      <div class="winner-sub" id="winner-sub"></div>
    </div>

    <p class="note">Results update live.</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { firebaseConfig, CHILIS } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    const noVotes   = document.getElementById("no-votes");
    const winnerBox = document.getElementById("winner-box");
    const winnerName = document.getElementById("winner-name");
    const winnerSub  = document.getElementById("winner-sub");

    onValue(ref(db, "votes"), snapshot => {
      const data     = snapshot.val() || {};
      const totals   = CHILIS.map(c => ({ ...c, count: data[c.id] || 0 }));
      const maxVotes = Math.max(...totals.map(c => c.count));

      if (maxVotes === 0) {
        winnerBox.classList.add("hidden");
        noVotes.classList.remove("hidden");
        return;
      }

      noVotes.classList.add("hidden");
      winnerBox.classList.remove("hidden");

      const winners = totals.filter(c => c.count === maxVotes);
      const totalVotes = totals.reduce((s, c) => s + c.count, 0);

      if (winners.length === 1) {
        winnerName.textContent = winners[0].label;
        winnerSub.textContent  = `${maxVotes} of ${totalVotes} votes`;
      } else {
        winnerName.textContent = "It's a Tie!";
        winnerSub.textContent  = winners.map(w => w.label).join(" & ");
      }
    });
  </script>
</body>
</html>
