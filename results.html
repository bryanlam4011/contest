<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results — Chili Contest</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">← Back</a>
    <h1>Results</h1>
    <div id="winner-banner" class="hidden winner-banner"></div>
    <p id="no-votes" class="note hidden" style="text-align:center; margin-top:2rem;">No votes yet.</p>
    <p class="note">Results update live.</p>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { firebaseConfig, CHILIS } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    const banner  = document.getElementById("winner-banner");
    const noVotes = document.getElementById("no-votes");

    onValue(ref(db, "votes"), snapshot => {
      const data     = snapshot.val() || {};
      const totals   = CHILIS.map(c => ({ ...c, count: data[c.id] || 0 }));
      const maxVotes = Math.max(...totals.map(c => c.count));

      if (maxVotes === 0) {
        banner.classList.add("hidden");
        noVotes.classList.remove("hidden");
        return;
      }

      noVotes.classList.add("hidden");
      banner.classList.remove("hidden");
      const winners = totals.filter(c => c.count === maxVotes);
      if (winners.length === 1) {
        banner.innerHTML = `<span class="trophy">🏆</span><strong>${winners[0].label}</strong> is the winner!`;
      } else {
        const tied = winners.map(w => w.label).join(" & ");
        banner.innerHTML = `<span class="trophy">🤝</span><strong>${tied}</strong> are tied!`;
      }
    });
  </script>
</body>
</html>
