<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results — Chili Contest</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">← Back</a>
    <h1>Results</h1>
    <div id="winner-banner" class="hidden winner-banner"></div>
    <div class="results-list" id="results-list">
      <p class="note" style="text-align:center; margin-top:2rem;">Loading...</p>
    </div>
    <p class="note">Results update live.</p>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // ── REPLACE with your Firebase project config ──────────────────────────
    const firebaseConfig = {
      apiKey:            "YOUR_API_KEY",
      authDomain:        "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL:       "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId:         "YOUR_PROJECT_ID",
      storageBucket:     "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId:             "YOUR_APP_ID",
    };
    // ───────────────────────────────────────────────────────────────────────

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    const CHILIS = [
      { id: "1", label: "Chili #1" },
      { id: "2", label: "Chili #2" },
      { id: "3", label: "Chili #3" },
      { id: "4", label: "Chili #4" },
    ];

    const list   = document.getElementById("results-list");
    const banner = document.getElementById("winner-banner");

    onValue(ref(db, "votes"), snapshot => {
      const data = snapshot.val() || {};
      const totals = CHILIS.map(c => ({ ...c, count: data[c.id] || 0 }));
      const totalVotes = totals.reduce((s, c) => s + c.count, 0);
      const maxVotes   = Math.max(...totals.map(c => c.count));
      const sorted     = [...totals].sort((a, b) => b.count - a.count);

      // Winner banner
      if (maxVotes > 0) {
        banner.classList.remove("hidden");
        const winners = sorted.filter(c => c.count === maxVotes);
        if (winners.length === 1) {
          banner.innerHTML = `<span class="trophy">🏆</span><strong>${winners[0].label}</strong> is winning!`;
        } else {
          const tied = winners.map(w => w.label).join(" & ");
          banner.innerHTML = `<span class="trophy">🤝</span><strong>${tied}</strong> are tied!`;
        }
      } else {
        banner.classList.add("hidden");
      }

      // Results rows
      if (totalVotes === 0) {
        list.innerHTML = `<p class="note" style="text-align:center; margin-top:2rem;">No votes yet.</p>`;
        return;
      }

      list.innerHTML = "";
      sorted.forEach(chili => {
        const pct       = Math.round((chili.count / totalVotes) * 100);
        const isLeading = chili.count === maxVotes && maxVotes > 0;
        const row = document.createElement("div");
        row.className = "result-row" + (isLeading ? " leading" : "");
        row.innerHTML = `
          <div class="result-label">
            ${isLeading ? "🌶️ " : ""}<span>${chili.label}</span>
          </div>
          <div class="result-bar-wrap">
            <div class="result-bar" style="width: ${pct}%"></div>
          </div>
          <div class="result-count">${chili.count} <small>(${pct}%)</small></div>
        `;
        list.appendChild(row);
      });
    });
  </script>
</body>
</html>
