<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chili Cook-Off 🌶️</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Decorative floating food elements -->
  <div class="deco-layer">
    <span class="deco deco-1">🍲</span>
    <span class="deco deco-2">🌶️</span>
    <span class="deco deco-3">🧅</span>
    <span class="deco deco-4">🥄</span>
    <span class="deco deco-5">🫙</span>
    <span class="deco deco-6">🧄</span>
    <span class="deco deco-7">🌶️</span>
    <span class="deco deco-8">🍅</span>
    <span class="deco deco-9">🥘</span>
    <span class="deco deco-10">🔥</span>
    <span class="deco deco-11">🫕</span>
    <span class="deco deco-12">🧂</span>
  </div>

  <!-- Steam puffs rising from bowls -->
  <div class="steam-layer">
    <span class="steam steam-1">💨</span>
    <span class="steam steam-2">💨</span>
    <span class="steam steam-3">💨</span>
    <span class="steam steam-4">💨</span>
    <span class="steam steam-5">💨</span>
    <span class="steam steam-6">💨</span>
  </div>

  <div class="container home-container">
    <div class="flames">🔥🌶️🔥</div>
    <h1 class="home-title">Chili<br>Cook-Off</h1>
    <p class="home-year">2026</p>
    <p class="home-subtitle">Who made the best chili?<br>Cast your vote and find out!</p>
    <div class="home-buttons">
      <a href="vote.html" class="btn btn-primary btn-big">🌶️ Cast Your Vote</a>
      <a href="results.html" class="btn btn-secondary btn-big">🏆 View Results</a>
    </div>

  </div>
</body>
</html>
